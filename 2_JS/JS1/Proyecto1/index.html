<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1: SPA Form Reader</title>
    <link rel="stylesheet" href="./Styles/main.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Gestión de Usuarios (SPA)</h1>
            <button id="theme-toggle" class="btn-theme">🌙 Modo Oscuro</button>
        </div>
    </header>

    <main class="container">
        <section class="form-section card">
            <h2>Cargar Nuevo Usuario</h2>
            <p class="subtitle">Demostración de los 3 métodos de lectura de formularios en JS.</p>
            
            <form id="user-form" name="userRegistration">
                <div class="form-group">
                    <label for="name">Nombre Completo:</label>
                    <input type="text" id="name" name="name" placeholder="Ej: Juan Pérez" required>
                    <span class="error-msg" id="error-name"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    <span class="error-msg" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="role">Rol:</label>
                    <select id="role" name="role" required>
                        <option value="">Seleccione un rol...</option>
                        <option value="admin">Administrador</option>
                        <option value="user">Usuario Estándar</option>
                        <option value="guest">Invitado</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Registrar Usuario</button>
                </div>
            </form>
        </section>

        <section class="list-section card">
            <h2>Usuarios Registrados</h2>
            <div id="user-list" class="user-grid">
                <!-- Los usuarios se cargarán aquí dinámicamente -->
                <p class="empty-msg">No hay usuarios registrados aún.</p>
            </div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script type="module" src="./Scripts/app.js"></script>
</body>
</html>
