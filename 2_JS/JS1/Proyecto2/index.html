<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 2: Inventory Manager</title>
    <link rel="stylesheet" href="./Styles/main.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Gestor de Inventario Dinámico</h1>
            <button id="theme-toggle" class="btn-theme">🌙 Modo Oscuro</button>
        </div>
    </header>

    <main class="container">
        <section class="form-section card">
            <h2>Ingresar Producto</h2>
            <form id="inventory-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productName">Nombre del Producto:</label>
                        <input type="text" id="productName" name="productName" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Categoría:</label>
                        <select id="category" name="category" required>
                            <option value="">Seleccione...</option>
                            <option value="deportes">Deportes</option>
                            <option value="herramientas">Herramientas</option>
                            <option value="tecnologia">Tecnología</option>
                            <option value="hogar">Hogar</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Precio (USD):</label>
                        <input type="number" id="price" name="price" min="1" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Inicial:</label>
                        <input type="number" id="stock" name="stock" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="sku">Código SKU:</label>
                        <input type="text" id="sku" name="sku" placeholder="ABC-12345" required>
                    </div>

                    <div class="form-group">
                        <label for="supplier">Proveedor:</label>
                        <input type="text" id="supplier" name="supplier" required>
                    </div>

                    <div class="form-group">
                        <label for="entryDate">Fecha de Ingreso:</label>
                        <input type="date" id="entryDate" name="entryDate" required>
                    </div>

                    <div class="form-group">
                        <label for="priority">Prioridad de Reposición:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="priority" value="Alta" required> Alta</label>
                            <label><input type="radio" name="priority" value="Media"> Media</label>
                            <label><input type="radio" name="priority" value="Baja"> Baja</label>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" id="add-btn" class="btn-primary">Añadir al final (push)</button>
                    <button type="button" id="unshift-btn" class="btn-secondary">Añadir al inicio (unshift)</button>
                    <button type="button" id="spread-btn" class="btn-accent">Copiar con Spread [...]</button>
                </div>
            </form>
        </section>

        <section class="list-section card">
            <div class="list-header">
                <h2>Lista de Productos</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar por nombre o SKU...">
                </div>
            </div>
            <div class="table-container">
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>SKU</th>
                            <th>Proveedor</th>
                            <th>Fecha</th>
                            <th>Prioridad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
                <div id="mobile-list" class="mobile-grid">
                    <!-- Tarjetas dinámicas para móvil -->
                </div>
                <p id="empty-msg" class="empty-msg">No hay productos en el inventario.</p>
            </div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script type="module" src="./Scripts/app.js"></script>
</body>
</html>
