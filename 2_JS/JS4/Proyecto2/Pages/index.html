<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 2 - POST a API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #fff;
            --text-primary: #1a202c;
            --text-secondary: #1a73e8;
            --border-color: #e0e4e9;
            --input-bg: #fff;
            --input-text: #1a202c;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #eee;
            --text-secondary: #7dd3fc;
            --border-color: #334155;
            --input-bg: #1a1a2e;
            --input-text: #eee;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-primary); }
        h1, h2, h3, h4, h5, h6 { color: var(--text-primary); }
        .card { border-radius: 1.5rem; border: none; box-shadow: 0 1rem 3rem rgba(0,0,0,0.1); margin-bottom: 2rem; background-color: var(--card-bg); color: var(--text-primary); }
        .section-title { font-weight: 800; color: var(--text-primary); border-left: 5px solid var(--text-secondary); padding-left: 1rem; margin-bottom: 1.5rem; }
        .response-card { background: var(--bg-color); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--border-color); color: var(--text-primary); }
        .form-control { background-color: var(--input-bg); color: var(--input-text); border-color: var(--border-color); }
        .form-control:focus { background-color: var(--input-bg); color: var(--input-text); }
        .form-control::placeholder { color: #adb5bd; opacity: 1; }
        .form-label { color: var(--text-primary); }
        .btn-outline-secondary { color: var(--text-primary); border-color: var(--border-color); }
        @media (max-width: 576px) {
            .card { padding: 1.5rem !important; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
            <h1 class="text-center mb-0 fw-bold flex-grow-1">Proyecto 2: POST a API</h1>
            <button id="theme-toggle" class="btn btn-outline-secondary">🌙 Modo Oscuro</button>
        </div>

        <div class="row justify-content-center px-2">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="card p-4">
                    <h4 class="section-title">Formulario de Usuario</h4>
                    <form id="user-form">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre">
                            <div id="name-error" class="text-danger small mt-1"></div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Ingresa tu email">
                            <div id="email-error" class="text-danger small mt-1"></div>
                        </div>
                        <div class="d-flex gap-2 flex-column flex-md-row">
                            <button type="submit" id="btn-fetch" class="btn btn-primary fw-bold flex-grow-1">Enviar con Fetch</button>
                            <button type="button" id="btn-axios" class="btn btn-success fw-bold flex-grow-1">Enviar con Axios</button>
                        </div>
                    </form>

                    <div id="response" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../Scripts/main.js"></script>
</body>
</html>
