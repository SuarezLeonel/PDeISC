<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 4 - API Propia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #fff;
            --text-primary: #1a202c;
            --text-secondary: #1a73e8;
            --border-color: #e0e4e9;
            --input-bg: #fff;
            --input-text: #1a202c;
            --avatar-bg: #1a73e8;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #eee;
            --text-secondary: #7dd3fc;
            --border-color: #334155;
            --input-bg: #1a1a2e;
            --input-text: #eee;
            --avatar-bg: #7dd3fc;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-primary); }
        h1, h2, h3, h4, h5, h6 { color: var(--text-primary); }
        .card { border-radius: 1.5rem; border: none; box-shadow: 0 1rem 3rem rgba(0,0,0,0.1); margin-bottom: 2rem; background-color: var(--card-bg); color: var(--text-primary); }
        .section-title { font-weight: 800; color: var(--text-primary); border-left: 5px solid var(--text-secondary); padding-left: 1rem; margin-bottom: 1.5rem; }
        
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--avatar-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .user-item {
            background: var(--bg-color);
            border-color: var(--border-color) !important;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .api-info { 
            background: var(--bg-color); 
            padding: 1rem; 
            border-radius: 0.5rem; 
            border: 1px solid var(--border-color); 
            font-family: 'JetBrains Mono', monospace; 
            color: var(--text-primary); 
        }
        
        .btn-outline-secondary { color: var(--text-primary); border-color: var(--border-color); }
        code { color: var(--text-secondary); }
        .text-muted { color: #adb5bd !important; }
        .text-secondary { color: #adb5bd !important; }
        
        @media (max-width: 576px) {
            .card { padding: 1.5rem !important; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
            <h1 class="text-center mb-0 fw-bold flex-grow-1">Proyecto 4: API Propia con Express</h1>
            <button id="theme-toggle" class="btn btn-outline-secondary">🌙 Modo Oscuro</button>
        </div>

        <div class="row justify-content-center px-2 mb-4">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="card p-4">
                    <h4 class="section-title">Información de la API</h4>
                    <div class="api-info text-break">
                        <p class="mb-0"><strong>Endpoint:</strong> <code>GET /api/alumnos</code></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center px-2">
            <!-- Sección Fetch -->
            <div class="col-12 col-lg-6 mb-4">
                <div class="card p-4 h-100">
                    <h4 class="section-title">Método: Fetch</h4>
                    <button id="btn-fetch" class="btn btn-primary fw-bold mb-3 w-100">Cargar Alumnos con Fetch</button>
                    <div id="fetch-alumnos" class="row"></div>
                </div>
            </div>
            
            <!-- Sección Axios -->
            <div class="col-12 col-lg-6 mb-4">
                <div class="card p-4 h-100">
                    <h4 class="section-title">Método: Axios</h4>
                    <button id="btn-axios" class="btn btn-success fw-bold mb-3 w-100">Cargar Alumnos con Axios</button>
                    <div id="axios-alumnos" class="row"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../Scripts/main.js"></script>
</body>
</html>
