<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - .filter()</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #fff;
            --text-primary: #1e293b;
            --text-secondary: #10b981;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #eee;
            --text-secondary: #86efac;
            --border-color: #334155;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-primary); }
        .card { border-radius: 1rem; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; background-color: var(--card-bg); }
        .display-area { background: var(--card-bg); padding: 1.2rem; border-radius: 0.8rem; border: 1px solid var(--border-color); font-family: monospace; color: var(--text-secondary); }
        .section-title { font-weight: 700; color: var(--text-primary); border-left: 4px solid var(--text-secondary); padding-left: 0.8rem; }
        @media (max-width: 576px) {
            .display-area { padding: 0.8rem; font-size: 0.9rem; }
            .card { padding: 1.2rem !important; }
            h1 { font-size: 1.75rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
            <h1 class="text-center mb-0 fw-bold flex-grow-1">Filtrado de Datos: .filter()</h1>
            <button id="theme-toggle" class="btn btn-outline-secondary">🌙 Modo Oscuro</button>
        </div>

        <div class="card p-4">
            <h5 class="section-title">1. Números > 10</h5>
            <div id="nums-display" class="display-area mb-3">Números: [5, 12, 8, 130, 44, 2, 19]</div>
            <button id="btn-nums" class="btn btn-success">Filtrar Mayores a 10</button>
            <div id="res-nums" class="mt-2 fw-bold"></div>
        </div>

        <div class="card p-4">
            <h5 class="section-title">2. Palabras > 5 letras</h5>
            <div id="words-display" class="display-area mb-3">Palabras: ["sol", "computadora", "mar", "estrella", "casa"]</div>
            <button id="btn-words" class="btn btn-dark">Filtrar Palabras Largas</button>
            <div id="res-words" class="mt-2 fw-bold"></div>
        </div>

        <div class="card p-4">
            <h5 class="section-title">3. Usuarios Activos</h5>
            <div id="users-display" class="display-area mb-3">Cargando usuarios...</div>
            <button id="btn-users" class="btn btn-outline-success">Mostrar solo activos</button>
            <div id="res-users" class="mt-2 fw-bold"></div>
        </div>
    </div>
    <script type="module" src="../Scripts/main.js"></script>
</body>
</html>
