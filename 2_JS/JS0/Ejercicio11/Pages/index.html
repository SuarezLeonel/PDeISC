<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - .filter()</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #1a202c;
            --card-bg: #ffffff;
            --card-shadow: 0 1rem 3rem rgba(0,0,0,0.1);
            --display-bg: #ffffff;
            --display-border: #e0e4e9;
            --display-text: #1a73e8;
            --input-bg: #ffffff;
            --input-border: #dee2e6;
            --input-text: #212529;
            --input-placeholder: #6c757d;
            --result-success: #0f9d58;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --card-shadow: 0 1rem 3rem rgba(0,0,0,0.3);
            --display-bg: #0f172a;
            --display-border: #334155;
            --display-text: #60a5fa;
            --input-bg: #0f172a;
            --input-border: #475569;
            --input-text: #f1f5f9;
            --input-placeholder: #94a3b8;
            --result-success: #4ade80;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .card { border-radius: 1.5rem; border: none; box-shadow: var(--card-shadow); margin-bottom: 2rem; background-color: var(--card-bg); transition: all 0.3s ease; }
        .display-area { background: var(--display-bg); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--display-border); font-family: 'JetBrains Mono', monospace; min-height: 60px; color: var(--display-text); transition: all 0.3s ease; }
        .section-title { font-weight: 800; color: var(--text-color); border-left: 5px solid #1a73e8; padding-left: 1rem; margin-bottom: 1.5rem; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .form-control { 
            background-color: var(--input-bg); 
            border-color: var(--input-border); 
            color: var(--input-text);
            transition: all 0.3s ease;
        }
        .form-control::placeholder { 
            color: var(--input-placeholder); 
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: #1a73e8;
            color: var(--input-text);
            box-shadow: 0 0 0 0.25rem rgba(26, 115, 232, 0.25);
        }
        .small { 
            color: var(--input-placeholder);
        }
        .result-text {
            color: var(--text-color);
        }
        .result-success {
            color: var(--result-success) !important;
        }
        @media (max-width: 779.98px) {
            .input-group {
                flex-direction: column !important;
                align-items: stretch;
            }
            .input-group .form-control,
            .input-group .btn {
                width: 100%;
                margin: 0 !important;
            }
            .input-group .form-control {
                margin-bottom: 0.75rem !important;
            }
            .card .row.g-2 > div {
                width: 100%;
                flex: 0 0 100%;
            }
            .card .row.g-2 > div + div {
                margin-top: 0.5rem;
            }
        }
        @media (max-width: 576px) {
            .display-area { padding: 1rem; font-size: 0.9rem; }
            .card { padding: 1.5rem !important; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body class="py-5">
    <button id="theme-toggle" class="theme-toggle btn btn-secondary fw-bold">🌙 Tema Oscuro</button>
    <div class="container-fluid px-4">
        <h1 class="text-center mb-5 fw-bold">Filtrado de Datos: .filter()</h1>

        <div class="row g-4 px-2">
            <div class="col-12 col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="section-title">1. Números > 10</h5>
                    <div id="nums-display" class="display-area mb-3">Números: [5, 12, 8, 130, 44, 2, 19]</div>
                    <button id="btn-nums" class="btn btn-success w-100">Filtrar Mayores a 10</button>
                    <div id="res-nums" class="mt-2 fw-bold result-text"></div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="section-title">2. Palabras > 5 letras</h5>
                    <div id="words-display" class="display-area mb-3">Palabras: ["sol", "computadora", "mar", "estrella", "casa"]</div>
                    <button id="btn-words" class="btn btn-dark w-100">Filtrar Palabras Largas</button>
                    <div id="res-words" class="mt-2 fw-bold result-text"></div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="section-title">3. Usuarios Activos</h5>
                    <div id="users-display" class="display-area mb-3">Cargando usuarios...</div>
                    <button id="btn-users" class="btn btn-outline-success w-100">Mostrar solo activos</button>
                    <div id="res-users" class="mt-2 fw-bold result-text"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../Scripts/main.js"></script>
</body>
</html>
