<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - .unshift()</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #1a202c;
            --card-bg: #ffffff;
            --card-shadow: 0 1rem 3rem rgba(0,0,0,0.1);
            --display-bg: #ffffff;
            --display-border: #e0e4e9;
            --display-text: #1a73e8;
            --input-bg: #ffffff;
            --input-border: #dee2e6;
            --input-text: #212529;
            --input-placeholder: #6c757d;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --card-shadow: 0 1rem 3rem rgba(0,0,0,0.3);
            --display-bg: #0f172a;
            --display-border: #334155;
            --display-text: #60a5fa;
            --input-bg: #0f172a;
            --input-border: #475569;
            --input-text: #f1f5f9;
            --input-placeholder: #94a3b8;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .card { border-radius: 1.5rem; border: none; box-shadow: var(--card-shadow); margin-bottom: 2rem; background-color: var(--card-bg); transition: all 0.3s ease; }
        .display-area { background: var(--display-bg); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--display-border); font-family: 'JetBrains Mono', monospace; min-height: 60px; color: var(--display-text); transition: all 0.3s ease; }
        .section-title { font-weight: 800; color: var(--text-color); border-left: 5px solid #1a73e8; padding-left: 1rem; margin-bottom: 1.5rem; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .form-control { 
            background-color: var(--input-bg); 
            border-color: var(--input-border); 
            color: var(--input-text);
            transition: all 0.3s ease;
        }
        .form-control::placeholder { 
            color: var(--input-placeholder); 
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: #1a73e8;
            color: var(--input-text);
            box-shadow: 0 0 0 0.25rem rgba(26, 115, 232, 0.25);
        }
        .small { 
            color: var(--input-placeholder);
        }
        @media (max-width: 779.98px) {
            .input-group {
                flex-direction: column !important;
                align-items: stretch;
            }
            .input-group .form-control,
            .input-group .btn {
                width: 100%;
                margin: 0 !important;
            }
            .input-group .form-control {
                margin-bottom: 0.75rem !important;
            }
            .card .row.g-2 > div {
                width: 100%;
                flex: 0 0 100%;
            }
            .card .row.g-2 > div + div {
                margin-top: 0.5rem;
            }
        }
        @media (max-width: 576px) {
            .display-area { padding: 1rem; font-size: 0.9rem; }
            .card { padding: 1.5rem !important; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body class="py-5">
    <button id="theme-toggle" class="theme-toggle btn btn-secondary fw-bold">🌙 Tema Oscuro</button>
    <div class="container-fluid px-4">
        <h1 class="text-center mb-5 fw-bold px-3">Entrada de Datos: .unshift()</h1>

        <div class="row g-4 px-2">
            <div class="col-12 col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="section-title">1. Agregar 3 Colores al Inicio</h5>
                    <div id="colores-display" class="display-area mb-3 text-break">Colores: []</div>
                    <div class="input-group mb-2 flex-column flex-md-row">
                        <input type="text" id="color-input" class="form-control mb-2 mb-md-0" placeholder="Nombre del color...">
                        <button id="btn-colores" class="btn btn-success ms-md-2">Agregar Color</button>
                    </div>
                    <div id="colores-count" class="small text-muted">Colores agregados: 0/3</div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="section-title">2. Nueva Tarea Urgente</h5>
                    <div id="tareas-display" class="display-area mb-3 text-break">Tareas: ["Estudiar", "Cocinar"]</div>
                    <div class="input-group flex-column flex-md-row">
                        <input type="text" id="tarea-input" class="form-control mb-2 mb-md-0" placeholder="Nombre de la tarea...">
                        <button id="btn-tarea" class="btn btn-primary ms-md-2 ">Insertar como urgente</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="section-title">3. Usuarios Conectados</h5>
                    <div id="users-display" class="display-area mb-3 text-break">Usuarios: ["Admin", "Guest"]</div>
                    <div class="input-group flex-column flex-md-row">
                        <input type="text" id="user-input" class="form-control mb-2 mb-md-0" placeholder="Nombre de usuario...">
                        <button id="btn-user" class="btn btn-dark ms-md-2 ">Conectar Usuario</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../Scripts/main.js"></script>
</body>
</html>
